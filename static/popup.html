<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MitID Auto Authenticator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="popup">
    <header class="band">MitID Auto Authenticator</header>

    <main>
      <form id="add-form" autocomplete="off">
        <div class="field-row">
          <input id="user-id" placeholder="Add Identity, e.g. Theo404" aria-label="MitID user ID to add" required />
          <button type="submit">Add</button>
        </div>
      </form>

      <div id="status" role="status" hidden>
        <div class="text"></div>
        <div class="detail"></div>
      </div>

      <ol id="identities"></ol>
      <p id="empty" class="muted" hidden>No Identities yet. Add one above, or import a mitid_users.txt in Options.</p>
    </main>

    <footer class="band">
      <button id="open-options" class="icon" type="button" title="Options" aria-label="Options">⚙</button>
    </footer>

    <template id="identity-row">
      <li class="identity">
        <div class="identity-row">
          <button type="button" data-action="toggle-details" class="user-id" title="Show details"></button>
          <span class="attention" hidden>⚠</span>
          <button type="button" data-action="log-in" class="primary" title="Log in to MitID on this tab as this Identity">Log in</button>
          <button type="button" data-action="approve" title="Approve a Login request you started yourself">Approve</button>
          <button type="button" data-action="remove" class="icon" title="Remove from list" aria-label="Remove from list">✕</button>
        </div>
        <section class="details" hidden></section>
      </li>
    </template>

    <script type="module" src="popup.js"></script>
  </body>
</html>
