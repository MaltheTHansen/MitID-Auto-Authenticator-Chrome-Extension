<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MitID Auto Authenticator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="panel">
    <header>
      <h1>MitID Auto Authenticator</h1>
      <button id="open-options" class="icon" type="button" title="Options" aria-label="Options">⚙</button>
    </header>

    <form id="add-form" autocomplete="off">
      <label for="user-id">Add Identity</label>
      <div class="field-row">
        <input id="user-id" placeholder="MitID user ID, e.g. Theo404" required />
        <button type="submit">Add</button>
      </div>
    </form>

    <div id="status" role="status" hidden>
      <div class="text"></div>
      <div class="detail"></div>
    </div>

    <ol id="identities"></ol>
    <p id="empty" class="muted" hidden>No Identities yet. Add one above, or import a mitid_users.txt in Options.</p>

    <footer id="shortcut-hint" class="muted"></footer>

    <template id="identity-row">
      <li class="identity">
        <span class="user-id"></span>
        <button type="button" data-action="approve" class="primary">Approve</button>
        <button type="button" data-action="up" class="icon" title="Move up" aria-label="Move up">↑</button>
        <button type="button" data-action="down" class="icon" title="Move down" aria-label="Move down">↓</button>
        <button type="button" data-action="remove" class="icon" title="Remove from list" aria-label="Remove from list">✕</button>
      </li>
    </template>

    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
